name: Fronta Kalendáře

# Dočasný plánovač pro test: co 10 minut zavolá chráněný endpoint Wiki, který odešle čekající
# pozvánky a načte odpovědi pozvaných. GitHub běh může zpozdit nebo vynechat, záloha je denní cron
# Vercelu a zpracování při návštěvě Wiki. Stav posledního běhu ukazuje Správa.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalendar-fronta
  cancel-in-progress: false

jobs:
  fronta:
    name: Zpracovat frontu
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Zavolat Wiki
        env:
          SCHEDULER: ${{ vars.CALENDAR_QUEUE_SCHEDULER }}
          # Výchozí je vývojové demo, proměnná repa WIKI_URL ji přepíše.
          WIKI_URL: ${{ vars.WIKI_URL || 'https://zbc-vzdelavani-demo.vercel.app' }}
          TOKEN: ${{ secrets.CALENDAR_WORKER_TOKEN }}
          # Jen pro preview za ochranou Vercel Authentication (Protection Bypass for Automation), jinak prázdné.
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # Záměrné vypnutí je proměnná repa CALENDAR_QUEUE_SCHEDULER=off: běh skončí úspěchem s poznámkou.
          # Bez ní chybějící WIKI_URL nebo CALENDAR_WORKER_TOKEN je chyba konfigurace a běh selže (K1/K8),
          # aby výpadek plánovače nezůstal schovaný za zelenými běhy.
          if [ "$SCHEDULER" = "off" ]; then
            echo "::notice::Plánovač je záměrně vypnutý (CALENDAR_QUEUE_SCHEDULER=off), nic se nevolá."
            exit 0
          fi
          # Bez secretu se workflow prokáže krátkodobým GitHub OIDC tokenem (endpoint ho přijme, když má
          # Wiki nastavené CALENDAR_WORKER_OIDC_REPOSITORY na toto repo). Secret zůstává jako záložní cesta.
          if [ -z "$TOKEN" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            TOKEN=$(curl -sS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=zbc-kalendar-fronta" | jq -r '.value // empty') || TOKEN=""
            [ -z "$TOKEN" ] || echo "::add-mask::$TOKEN"
          fi
          missing=()
          [ -n "$WIKI_URL" ] || missing+=("proměnná WIKI_URL")
          [ -n "$TOKEN" ] || missing+=("OIDC token ani secret CALENDAR_WORKER_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Plánovač není nastavený, chybí: ${missing[*]}. Doplň je v Settings → Secrets and variables → Actions, nebo plánovač záměrně vypni proměnnou CALENDAR_QUEUE_SCHEDULER=off."
            exit 1
          fi
          # Tělo odpovědi se nevypisuje, log nese jen stavový kód.
          bypass=()
          [ -z "$BYPASS" ] || bypass=(-H "x-vercel-protection-bypass: $BYPASS")
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 20 \
            -X POST -H "Authorization: Bearer $TOKEN" "${bypass[@]}" "${WIKI_URL%/}/api/kalendar/fronta") || true
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Endpoint fronty vrátil HTTP $code (401 = neplatný token, 404/000 = špatná WIKI_URL nebo nedostupná Wiki, 5xx = chyba zpracování)."
            exit 1
          fi

  udrzet-zapnuty:
    # GitHub vypne plánované workflow veřejného repa po 60 dnech bez aktivity. Jednou denně ho
    # proto znovu zapne přes API (neověřeno, že tím odpočet skutečně začne znovu; Správa výpadek ohlásí).
    name: Udržet plánovač zapnutý
    if: github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Zapnout workflow (jednou denně)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%H%M)" \< "0010" ] || exit 0
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/kalendar-fronta.yml/enable" --silent

name: Kontrola kódu

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  kontrola:
    name: Lint, typy, testy a build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout přesného commitu PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Build bez produkčních tajemství: hodnoty jsou jen pro sestavení, nikde neplatí.
      - run: npm run build
        env:
          SESSION_SECRET: ci-only-build-placeholder-not-a-secret-0000
          DEMO_ACCESS_CODE: ci-only-build-placeholder
